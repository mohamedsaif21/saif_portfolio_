<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
</head>
<body style="margin:0">
  <div class="hero-stage" style="height:900px">
    <div class="hero-layer hero-layer--solid"><div class="hero-word" data-text="PORTFOLIO"></div></div>
    <div class="hero-cutout-wrap"><img class="hero-cutout" src="./Assest/saif-cutout.png" alt=""></div>
    <div class="hero-layer hero-layer--outline"><div class="hero-word" data-text="PORTFOLIO"></div></div>
  </div>
  <pre id="diag"></pre>
  <script>
    document.querySelectorAll('.hero-word[data-text]').forEach(el => {
      el.innerHTML = [...el.dataset.text].map(c => `<span class="ch">${c}</span>`).join('');
    });
    const o = document.querySelector('.hero-layer--outline');
    const w = o.querySelector('.hero-word');
    const cs = getComputedStyle(o);
    const img = document.querySelector('.hero-cutout');
    document.getElementById('diag').textContent = JSON.stringify({
      maskImage: cs.maskImage || cs.webkitMaskImage,
      maskSize: cs.maskSize || cs.webkitMaskSize,
      maskPosition: cs.maskPosition,
      maskRepeat: cs.maskRepeat,
      zIndex: cs.zIndex,
      wordColor: getComputedStyle(w).color,
      stroke: getComputedStyle(w).webkitTextStrokeWidth + ' ' + getComputedStyle(w).webkitTextStrokeColor,
      font: getComputedStyle(w).fontFamily,
      personH: getComputedStyle(o).getPropertyValue('--person-h'),
      imgLoaded: img.complete,
      imgNatural: img.naturalWidth + 'x' + img.naturalHeight
    }, null, 2);
  </script>
</body>
</html>
