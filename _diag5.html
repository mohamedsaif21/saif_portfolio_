<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="style.css">
<style>body{margin:0;background:#000}.hero-stage{height:500px;--person-h:480px}.m{mask-image:url(./_masktest.png);-webkit-mask-image:url(./_masktest.png);mask-size:400px 400px;-webkit-mask-size:400px 400px;mask-position:center center;-webkit-mask-position:center center;mask-repeat:no-repeat;-webkit-mask-repeat:no-repeat}</style>
</head><body>
