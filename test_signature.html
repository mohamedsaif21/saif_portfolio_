<!DOCTYPE html>
<html>
<head>
<style>
:root { --primary: #c4ff00; }
body { background: #0b0b0b; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.signature-svg { width: 340px; height: 120px; }
</style>
</head>
<body>
<svg class="signature-svg" viewBox="0 0 320 110" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Mohamed Saif Signature">
  <!-- Dynamic Filter for Signature Neon Glow -->
  <defs>
    <filter id="sigGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#sigGlow)">
    <!-- 1. The 'M' -->
    <path class="signature-path sig-path-m" d="M 28,76 C 24,56 35,26 44,20 C 50,16 57,32 60,65 C 64,40 73,26 80,26 C 88,26 92,44 94,66 C 96,72 101,70 106,66" stroke="var(--primary)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 2. Dot after M -->
    <path class="signature-path sig-path-dot1" d="M 112,68 C 113,67 114,68 113,69" stroke="var(--primary)" stroke-width="4.2" stroke-linecap="round"/>

    <!-- 3. Cursive 'Saif' -->
    <path class="signature-path sig-path-saif" d="M 126,68 C 132,54 140,24 148,18 C 156,12 160,24 150,40 C 136,58 142,70 156,66 C 164,62 170,52 176,50 C 172,46 164,54 168,62 C 172,70 182,68 186,54 L 186,66 C 190,56 198,46 202,48 C 205,50 204,58 206,66 C 210,54 220,24 228,14 C 234,6 238,18 230,42 C 220,74 214,96 220,96 C 225,96 228,84 232,70 C 236,56 244,54 256,52" stroke="var(--primary)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 4. Dot on 'i' -->
    <path class="signature-path sig-path-dot2" d="M 200,34 C 201,33 203,34 202,36" stroke="var(--primary)" stroke-width="4.2" stroke-linecap="round"/>

    <!-- 5. Underline Flourish -->
    <path class="signature-path sig-path-flourish" d="M 38,88 C 90,95 180,97 245,82 C 270,76 295,68 310,62" stroke="var(--primary)" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>

</body>
</html>
