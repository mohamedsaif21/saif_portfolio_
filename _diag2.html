<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { margin: 0; background: #000; }
    .test { position: relative; height: 400px; overflow: hidden; background: #0b0b0b; }
    .test .hero-layer { position: absolute; inset: 0; display: grid; place-items: center; }
    .test .hero-word { font-size: 120px; }
    .no-mask .hero-layer--outline { -webkit-mask-image: none !important; mask-image: none !important; }
    .circle-mask .hero-layer--outline {
      -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0 120px, transparent 121px) !important;
      mask-image: radial-gradient(circle at 50% 50%, #000 0 120px, transparent 121px) !important;
      -webkit-mask-size: auto !important; mask-size: auto !important;
    }
  </style>
</head>
<body>
  <div class="test no-mask" id="t1">
    <div class="hero-layer hero-layer--solid"><div class="hero-word" data-text="PORTFOLIO"></div></div>
    <div class="hero-layer hero-layer--outline"><div class="hero-word" data-text="PORTFOLIO"></div></div>
  </div>
  <div class="test circle-mask" id="t2">
    <div class="hero-layer hero-layer--solid"><div class="hero-word" data-text="PORTFOLIO"></div></div>
    <div class="hero-layer hero-layer--outline"><div class="hero-word" data-text="PORTFOLIO"></div></div>
  </div>
  <div class="test image-mask" id="t3">
    <div class="hero-layer hero-layer--solid"><div class="hero-word" data-text="PORTFOLIO"></div></div>
    <div class="hero-layer hero-layer--outline"><div class="hero-word" data-text="PORTFOLIO"></div></div>
  </div>
  <script>
    document.querySelectorAll('.hero-word[data-text]').forEach(el => {
      el.innerHTML = [...el.dataset.text].map(c => `<span class="ch">${c}</span>`).join('');
    });
  </script>
</body>
</html>
